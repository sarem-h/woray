name: Build iOS Dev-Client Shell (.ipa)

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/ios-client/**'

jobs:
  build-ios-shell:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Monorepo Dependencies
        run: |
          npm install

      - name: Stamp Dynamic Build & Version Number
        working-directory: apps/ios-client
        run: |
          node -e '
            const fs = require("fs");
            const appJson = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const runNum = "${{ github.run_number }}";
            appJson.expo.version = `1.0.${runNum}`;
            if (!appJson.expo.ios) appJson.expo.ios = {};
            appJson.expo.ios.buildNumber = runNum;
            fs.writeFileSync("app.json", JSON.stringify(appJson, null, 2), "utf8");
            console.log(`Stamped app.json with version 1.0.${runNum} (Build ${runNum})`);
          '

      - name: Run Expo Prebuild (iOS Native Generation)
        working-directory: apps/ios-client
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: |
          npx expo prebuild --platform ios --clean

      - name: Resolve CocoaPods Spec Sources
        working-directory: apps/ios-client/ios
        run: |
          # Strip duplicate livekit/podspecs source from Podfile so only trunk is used
          sed -i '' '/github\.com\/livekit\/podspecs/d' Podfile 2>/dev/null || sed -i '/github\.com\/livekit\/podspecs/d' Podfile 2>/dev/null || true
          rm -rf ~/.cocoapods/repos/livekit-podspecs 2>/dev/null || true
          pod repo remove livekit-podspecs 2>/dev/null || true

      - name: Install CocoaPods
        working-directory: apps/ios-client/ios
        run: |
          pod install

      - name: Compile Debug Dev-Client .app Bundle
        working-directory: apps/ios-client/ios
        run: |
          WORKSPACE_FILE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE_FILE" ]; then
            echo "Error: No .xcworkspace found in apps/ios-client/ios"
            exit 1
          fi
          SCHEME_NAME=$(basename "$WORKSPACE_FILE" .xcworkspace)
          echo "Detected Workspace: $WORKSPACE_FILE"
          echo "Detected Scheme: $SCHEME_NAME"

          xcodebuild \
            -workspace "$WORKSPACE_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Unsigned .ipa for Sideloadly
        working-directory: apps/ios-client/ios
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: No compiled .app bundle found in build/Build/Products/Debug-iphoneos"
            exit 1
          fi
          echo "Packaging App Bundle: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y "Woray-DevClient-v1.0.${{ github.run_number }}.ipa" Payload

      - name: Upload Dev-Client IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Woray-DevClient-v1.0.${{ github.run_number }}.ipa
          path: apps/ios-client/ios/Woray-DevClient-v1.0.${{ github.run_number }}.ipa
          if-no-files-found: error
          retention-days: 14
